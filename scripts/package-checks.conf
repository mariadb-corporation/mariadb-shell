# Per-plugin CLI checks run by scripts/verify_package.sh against an unpacked
# package. One check per line:
#
#     <global-object>|<cli arguments>|<extended regex the output must match>
#
# The check runs `mariadb-shell -- <global-object> <cli arguments>` and fails if
# the exit status is non-zero, if anything is written to stderr, or if stdout
# does not match the regex.
#
# Lines whose plugin is not present in the package are SKIPPED, not failed --
# mcp_plugin is optional (shell-release.yml bundles it only when the plugins repo
# has it), so its absence is not an error here.
#
# Blank lines and lines starting with # are ignored.
#
# NOTE: `sandbox` is deliberately absent. sandbox.version reports the MariaDB
# *server* version a sandbox would use, not the plugin's own version, so it is
# not a plugin-version check and would fail on a runner with no server present.
# The generic load check in verify_package.sh already covers that sandbox loads.

mrs|version|^[0-9]+\.[0-9]+\.[0-9]+
msm|version|^[0-9]+\.[0-9]+\.[0-9]+
mcp|version|^[0-9]+\.[0-9]+\.[0-9]+
