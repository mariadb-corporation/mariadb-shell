name: MariaDB-Shell-CI

# Builds the shell, optionally tests it, and caches the package it produced
# under a key derived from the source tree. It never touches the shell that
# ~/.cache/ci serves to other workflows -- deciding when that one is replaced,
# and replacing it, belongs to MariaDB-Shell-CI-Publish.

on:
  pull_request:
      branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test:
        description: 'Run the unit tests'
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      test:
        description: 'Run the unit tests'
        type: boolean
        required: false
        default: true

jobs:
  ensure-runner:
      # A PR tagged [bypass-ci] skips every build step, so there is no point
      # spinning the self-hosted runner up for it.
      if: ${{ !contains(github.event.pull_request.title, '[bypass-ci]') }}
      uses: ./.github/workflows/devtools-ci-start.yml
      secrets: inherit
  
  build:
    name: Shell-CI-Verification

    needs: ensure-runner

    # ensure-runner is skipped on two legitimate paths -- a [bypass-ci] PR, and
    # a fork PR, which the reusable workflow declines because it has no access
    # to the GCP secrets -- and both still want this job to run: the fork case
    # builds on ubuntu-latest, the bypass case runs no steps but keeps the
    # check reporting. Only a runner that actually failed to start should stop
    # us, since every step below would then be waiting on a runner that is not
    # coming.
    if: ${{ always() && needs.ensure-runner.result != 'failure' && needs.ensure-runner.result != 'cancelled' }}

    # Both paths that skip ensure-runner have to land on a hosted runner. A job
    # is assigned to a runner BEFORE its steps' `if:` conditions are evaluated,
    # so 'self-hosted' here would sit queued until the 24h timeout waiting for
    # the GCP VM that ensure-runner never started -- the steps skipping is no
    # help, the job never gets far enough to skip them. A fork PR could not
    # reach the self-hosted runner anyway; a [bypass-ci] PR skips every step and
    # exists only to report the check.
    runs-on: ${{ (github.event.pull_request.head.repo.fork || contains(github.event.pull_request.title, '[bypass-ci]')) && 'ubuntu-latest' || 'self-hosted' }}

    env:
      MARIADB_SHELL_BUILD_DIR: bld
      # Being invoked at all is the request to build and cache; [bypass-ci] is
      # the only thing that calls it off.
      RUN_BUILD: ${{ !contains(github.event.pull_request.title, '[bypass-ci]') }}
      # A pull_request run supplies no inputs, so `inputs.*` is empty there:
      # fall back to the pull request policy of always testing. Manual and
      # called runs go by whatever they asked for.
      RUN_TESTS: ${{ !contains(github.event.pull_request.title, '[bypass-ci]')
        && (github.event_name == 'pull_request' || inputs.test || github.ref == 'refs/heads/workflow-test') }}

    steps:
      # Echo a message if bypassing
      - name: Skip CI Notice
        if: contains(github.event.pull_request.title, '[bypass-ci]')
        run: echo "Bypassing CI checks due to PR title tag."

      # ========================================
      # 0. CHECKOUT MAIN PROJECT (MUST BE FIRST)
      # ========================================
      - name: Checkout Main Project
        if: env.RUN_BUILD == 'true'
        uses: actions/checkout@v4

      # ==========
      # 0b. CCACHE
      # ==========
      - name: Setup ccache
        if: env.RUN_BUILD == 'true'
        run: |
          set -euo pipefail

          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ccache
          fi

          # An absolute path, not the literal '~': ccache reads CCACHE_DIR as a
          # path, and nothing expands a tilde that arrives through the
          # environment rather than through a shell word.
          #
          # A tree of its own rather than the ~/.cache/ccache that
          # server-build.yml uses: the server is an order of magnitude bigger
          # than the shell, so a shared cache would let the weekly server build
          # evict every shell object between one shell run and the next.
          echo "CCACHE_DIR=$HOME/.cache/ci/ccache-shell" >> "$GITHUB_ENV"

      # A step of its own because a variable exported through $GITHUB_ENV only
      # reaches the steps that follow, never the one that wrote it.
      - name: Prime ccache
        if: env.RUN_BUILD == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=10G
          # Per-run counters, so the summary printed after the build describes
          # this build and not every build since the runner was created.
          ccache --zero-stats

      # ============
      # 1. CONFIGURE
      # ============
      - name: Configure MariaDB Shell
        if: env.RUN_BUILD == 'true'
        run: |
          # Resolve the wildcard path to an absolute path
          MARIADB_BIN=$(echo ~/.cache/ci/mariadb*/bin)

          # Add to GitHub Actions global PATH for all subsequent steps
          echo "$MARIADB_BIN" >> $GITHUB_PATH

          mkdir -p ${{ env.MARIADB_SHELL_BUILD_DIR }}
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}

          # The compiler launchers are the only addition here: the rest of the
          # line has to stay byte-identical to what a publishing run configures
          # with, or the tarball a pull request stages would not be the tarball
          # the merge was going to build.
          #
          # ccache's own defaults are left alone deliberately. RelWithDebInfo
          # means -g, so ccache hashes the working directory (hash_dir) to keep
          # debug paths honest; the self-hosted runner checks this repo out at
          # the same workspace path every run, so that costs no hits, and
          # turning it off to chase path-independence we do not need would put
          # wrong paths in a published binary's debug info.
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWITH_PYTHON_SOURCE=3.14.6 -DWITH_VCPKG_TRIPLET=x64-linux-dynamic \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ============
      # 1. BUILD
      # ============
      - name: Build MariaDB Shell
        if: env.RUN_BUILD == 'true'
        run: |
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}

          # A job count, never a bare --parallel: with no number cmake hands the
          # generator an unlimited job budget, which on a big link step is a
          # reliable way to exhaust the runner's memory. $(nproc) matches what
          # server-build.yml passes to make.
          cmake --build . --parallel "$(nproc)"

      # Reported even when the build failed -- a sudden collapse in the hit
      # rate is worth seeing. Never allowed to fail the job: this is a
      # diagnostic, and it also runs on the path where ccache is missing
      # because its own setup step is what failed.
      - name: Report ccache statistics
        if: always() && env.RUN_BUILD == 'true'
        run: ccache --show-stats || true


      # ============
      # 2. SETUP TEST ENVIRONMENT
      # ============
      - name: Setup Test Environment
        if: env.RUN_TESTS == 'true'
        id: setup
        run: |
          # Seed this run's timing profile from the previous run's, cached on
          # the self-hosted runner, so the LPT partitioning has historical
          # data to balance workers with. Absent on a runner's first-ever run.
          if [ -f ~/.cache/ci/test-execution-times.txt ]; then
            cp ~/.cache/ci/test-execution-times.txt .
          fi


      # ============
      # 3. EXECUTE TESTS
      # ============
      - name: Execute Unit Tests
        if: env.RUN_TESTS == 'true'
        run: |
          python3 scripts/run_unit_tests.py -t ~/.cache/ci/test-execution-times.txt --binary ${{ env.MARIADB_SHELL_BUILD_DIR }}/bin/run_unit_tests --shell-binary ${{ env.MARIADB_SHELL_BUILD_DIR }}/bin/mariadb-shell -s Shell_scripted/Auto_script_py --gtest_filter="-*Threaded_file*"
          python3 scripts/plot_execution_plan.py
          cp test-execution-times.txt ~/.cache/ci

      # =====================
      # 4. PACKAGE AND CACHE
      # =====================
      - name: Package and cache MariaDB Shell
        # After the tests, and inheriting the default "only if every earlier
        # step passed", so a package the tests rejected is never cached for a
        # later publish to pick up.
        #
        # Keyed by the source tree, never by the commit. On a pull request,
        # actions/checkout builds refs/pull/N/merge -- this branch already
        # merged into main -- so the tree hashed here is the exact tree the
        # squash merge will put on main, and MariaDB-Shell-CI-Publish finds
        # this tarball by it instead of rebuilding identical sources. On the
        # rebuild path it is main's own tree, which is the same key the publish
        # then looks under.
        #
        # Nothing matches when main moves between this run and the merge:
        # GitHub recomputes the merge commit, the tree changes, and the publish
        # falls back to a build. That is the correct answer -- the code really
        # did change.
        #
        # Skipped off the self-hosted runner because ~/.cache/ci is that
        # machine's shared cache; a fork pull request builds on a hosted runner
        # that is wiped, so caching there would write to nowhere.
        if: env.RUN_BUILD == 'true' && runner.environment == 'self-hosted'
        run: |
          set -euo pipefail

          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}

          # The tarball name carries the version, so a version bump would leave
          # the previous one behind and make the globs below match two files.
          rm -f mariadb-shell*.tar.gz

          # -G, not -T: cpack silently ignores -T, which would leave the
          # generator up to CPackConfig.cmake -- and that is only TGZ for a
          # portable build (cmake/packaging.cmake). A system-dependency Linux
          # configure would emit a .deb/.rpm instead and no tarball at all.
          cpack -G TGZ -C RelWithDebInfo
          cd ..

          TREE=$(git rev-parse 'HEAD^{tree}')
          STAGING=~/.cache/ci/staging
          echo "Caching the shell built from tree $TREE"

          # Assembled aside and moved into place, so a run cancelled midway
          # through the copy cannot leave a half-written tarball under a key
          # that a later publish would then trust and ship.
          TMP="$STAGING/.tmp.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cp ${{ env.MARIADB_SHELL_BUILD_DIR }}/mariadb-shell*.tar.gz "$TMP/"
          rm -rf "$STAGING/${TREE:?}"
          mv "$TMP" "$STAGING/$TREE"

          # Every run leaves a tarball here and only the merged ones are ever
          # collected, so the directory needs a bound. A week is far longer
          # than the gap between a run and its merge; raise it only if the
          # runner starts missing entries it should have found. This also
          # sweeps up the .tmp dirs of cancelled runs.
          find "$STAGING" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + || true

      # ============
      # 5. ARCHIVE
      # ============
      - name: Archive Test Execution Artifacts
        # always(), and not gated on success, so the plan/report/logs are still
        # picked up when a suite failure is exactly what we want to diagnose.
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-artifacts
          path: test-execution-*
          if-no-files-found: warn
          retention-days: 7

