name: MariaDB-Shell-CI

on:
  pull_request:
      branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test:
        description: 'Run the unit tests'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Package the shell and publish it to ~/.cache/ci'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      test:
        description: 'Run the unit tests'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Package the shell and publish it to ~/.cache/ci'
        type: boolean
        required: false
        default: false

jobs:
  ensure-runner:
      uses: ./.github/workflows/shell-ci-start-vm.yml
      secrets: inherit
  
  build:
    name: Shell-CI-Verification

    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}

    env:
      MARIADB_SHELL_BUILD_DIR: bld
      MYSQL_PORT: 3312
      # A pull_request run supplies no inputs, so `inputs.*` is empty there:
      # fall back to the pull request policy of always testing, never
      # publishing. Manual and called runs go by whatever they asked for.
      RUN_TESTS: ${{ !contains(github.event.pull_request.title, '[bypass-ci]')
        && (github.event_name == 'pull_request' || inputs.test || github.ref == 'refs/heads/workflow-test') }}
      RUN_PUBLISH: ${{ !contains(github.event.pull_request.title, '[bypass-ci]')
        && github.event_name != 'pull_request' && inputs.publish }}

    steps:
      # Echo a message if bypassing
      - name: Skip CI Notice
        if: contains(github.event.pull_request.title, '[bypass-ci]')
        run: echo "Bypassing CI checks due to PR title tag."

      # ========================================
      # 0. CHECKOUT MAIN PROJECT (MUST BE FIRST)
      # ========================================
      - name: Checkout Main Project
        if: env.RUN_TESTS == 'true' || env.RUN_PUBLISH == 'true'
        uses: actions/checkout@v4

      # ============
      # 1. CONFIGURE
      # ============
      - name: Configure MariaDB Shell
        if: env.RUN_TESTS == 'true' || env.RUN_PUBLISH == 'true'
        run: |
          # Resolve the wildcard path to an absolute path
          MARIADB_BIN=$(echo ~/.cache/ci/mariadb*/bin)
          
          # Add to GitHub Actions global PATH for all subsequent steps
          echo "$MARIADB_BIN" >> $GITHUB_PATH

          mkdir -p ${{ env.MARIADB_SHELL_BUILD_DIR }}
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}
          
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWITH_PYTHON_SOURCE=3.14.6 -DWITH_VCPKG_TRIPLET=x64-linux-dynamic

      # ============
      # 1. BUILD
      # ============
      - name: Build MariaDB Shell
        if: env.RUN_TESTS == 'true' || env.RUN_PUBLISH == 'true'
        run: |
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}
          cmake --build . --parallel


      # ============
      # 2. SETUP TEST ENVIRONMENT
      # ============
      - name: Setup Test Environment
        if: env.RUN_TESTS == 'true'
        id: setup
        run: |
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}
          cd bin
          ./mariadb-shell -- sandbox deploy $MYSQL_PORT --password=

          # Mark that deployment succeeded so cleanup knows to run
          echo "deployed=true" >> $GITHUB_OUTPUT          

      # ============
      # 3. EXECUTE TESTS
      # ============
      - name: Execute Unit Tests
        if: env.RUN_TESTS == 'true'
        run: |
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}
          cd bin
          ./run_unit_tests --gtest_filter="-*Slow_*"

      # ============
      # 4. PUBLISH
      # ============
      - name: Publish MariaDB Shell
        # After the tests so a publishing run that also tests only ships a
        # package the tests signed off on.
        if: env.RUN_PUBLISH == 'true'
        run: |
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}

          # The tarball name carries the version, so a version bump would leave
          # the previous one behind and make the glob below match two files.
          rm -f mariadb-shell*.tar.gz

          # -G, not -T: cpack silently ignores -T, which would leave the
          # generator up to CPackConfig.cmake -- and that is only TGZ for a
          # portable build (cmake/packaging.cmake). A system-dependency Linux
          # configure would emit a .deb/.rpm instead and no tarball at all.
          cpack -G TGZ -C RelWithDebInfo

          # Publish the tarball itself: consumers unpack it wherever they need
          # it. The name is versioned, so clear any previous one rather than
          # leaving two tarballs for a consumer's glob to trip over.
          mkdir -p ~/.cache/ci
          rm -f ~/.cache/ci/mariadb-shell*.tar.gz
          cp mariadb-shell*.tar.gz ~/.cache/ci/

      # ============
      # 5. CLEANUP
      # ============
      - name: Teardown Test Environment
        # Runs if 'deploy' step set output AND job wasn't cancelled abruptly before deploy
        if: always() && steps.setup.outputs.deployed == 'true'
        run: |
          echo "Tearing down server..."
          cd ${{ env.MARIADB_SHELL_BUILD_DIR }}
          cd bin
          ./mariadb-shell -- sandbox stop $MYSQL_PORT
          ./mariadb-shell -- sandbox delete $MYSQL_PORT
