name: Publish Release

# Publishing is a deliberate, manual act, decoupled from building:
# MariaDB-Shell-Release only builds and leaves its packages as run artifacts.
# This workflow picks one of those runs and turns it into a release, so a run can
# be inspected first, and any past run can be published (or re-published)
# without rebuilding anything.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run to publish (blank = latest successful MariaDB-Shell-Release run)"
        type: string
        required: false
      tag:
        description: "Release tag (blank = v<version>, version read from MYSQL_VERSION at that run's commit)"
        type: string
        required: false
      prerelease:
        # A prerelease is invisible to /releases/latest/, which is where the
        # installer looks for packages when no tag is pinned. The notes below
        # compensate by generating an install command that pins this tag, so a
        # prerelease stays installable -- but only by that command, not by the
        # version-free one published for stable releases.
        description: "Mark as prerelease (invisible to /releases/latest/; notes get a tag-pinned install command)"
        type: boolean
        default: false
      dry_run:
        # Everything a real publish does except the release itself: the
        # verification gate, the package set, the checksums, the installer and
        # the notes are all produced, and the assembled assets are uploaded as a
        # run artifact to be inspected. Nothing is created, tagged or uploaded to
        # a release, so this is the way to exercise a change to this workflow
        # without leaving a tag behind on the build commit.
        description: "Assemble and check everything, but create no release"
        type: boolean
        default: false
      server_11_tag:
        # Matched against sandbox-server.yml's run-name, which is exactly the
        # 'MariaDB Branch/Tag to build' that workflow was given -- so this is
        # the same string you'd type into that workflow's own mariadb_version
        # input (e.g. "11.4"), not a run id. The latest successful Sandbox
        # Server run for that exact tag is published. Blank omits this line
        # from the release entirely.
        description: "Server tag for the 11.x line (blank = don't publish an 11.x server package)"
        type: string
        required: false
      server_12_tag:
        description: "Server tag for the 12.x line (blank = don't publish a 12.x server package)"
        type: string
        required: false
      server_13_tag:
        description: "Server tag for the 13.x line (blank = don't publish a 13.x server package)"
        type: string
        required: false

# Says which of the two this run was, in the Actions list -- a dry run should not
# read as a publish at a glance.
run-name: >-
  ${{ inputs.dry_run && 'Dry run' || 'Publish' }}
  ${{ inputs.tag || '(version from build)' }}
  from run ${{ inputs.run_id || '(latest)' }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create/update the release
      actions: read     # read artifacts from the build run

    steps:
      # ====================================================================
      # 1. RESOLVE WHICH BUILD RUN TO PUBLISH
      #
      # Resolving the run's head SHA matters as much as its id: the version and
      # the installer must come from the source that produced those binaries,
      # not from whatever the default branch happens to hold now. Publishing an
      # older run would otherwise silently mislabel it.
      # ====================================================================
      - name: Resolve Build Run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$RUN_ID" ]; then
            echo "==> No run_id given; finding the latest successful build run."
            RUN_ID=$(gh run list -R "$REPO" \
              --workflow "shell-release.yml" \
              --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$RUN_ID" ]; then
              echo "No successful MariaDB-Shell-Release run found to publish." >&2
              exit 1
            fi
          fi

          # Refuse a run that did not succeed, rather than assembling a release
          # from whatever subset of platforms happened to finish.
          CONCLUSION=$(gh run view "$RUN_ID" -R "$REPO" --json conclusion --jq .conclusion)
          if [ "$CONCLUSION" != "success" ]; then
            echo "Run $RUN_ID concluded '$CONCLUSION', not 'success'; refusing to publish." >&2
            exit 1
          fi

          SHA=$(gh run view "$RUN_ID" -R "$REPO" --json headSha --jq .headSha)
          echo "==> Publishing run $RUN_ID (commit $SHA)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"       >> "$GITHUB_OUTPUT"

      # ====================================================================
      # 2. REFUSE A BUILD THAT WAS NEVER VERIFIED
      #
      # Verify Packages unpacks a build's own packages on machines that never
      # built them; a release must not be assembled from bits that check never
      # passed on. Nothing in the API says which build run a workflow_run-
      # triggered run was verifying, so verification leaves an artifact named
      # after the build run id (the `record` job in verify-packages.yml) and this
      # looks for it. Only successful verification runs are searched, and the
      # marker is written only when every platform leg passed -- so a failed, a
      # partial, an in-progress and a never-run verification all arrive here as
      # the same refusal.
      #
      # Matching on the artifact NAME, which the API keeps listing after the
      # content expires, so an older build stays publishable.
      # ====================================================================
      - name: Require Successful Package Verification
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail

          MARKER="verified-build-$RUN_ID"
          VERIFY_RUN=""

          echo "==> Looking for artifact '$MARKER'"

          # Assigned first, deliberately: `for id in $(gh api ...)` swallows a
          # failed query into an empty list, which would then read as "never
          # verified". An assignment propagates the failure under set -e, so an
          # API outage says so instead of masquerading as a verdict.
          CANDIDATES=$(gh api \
            "repos/$REPO/actions/workflows/verify-packages.yml/runs?status=success&per_page=30" \
            --jq '.workflow_runs[].id')

          for id in $CANDIDATES; do
            if gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
                 --jq '.artifacts[].name' | grep -qxF "$MARKER"; then
              VERIFY_RUN="$id"
              break
            fi
          done

          if [ -z "$VERIFY_RUN" ]; then
            echo "Build run $RUN_ID has no successful package verification." >&2
            echo "" >&2
            echo "No artifact named '$MARKER' on any successful Verify Packages" >&2
            echo "run: verification failed, covered only some platforms, is still" >&2
            echo "running, or was never started for this build." >&2
            echo "" >&2
            echo "Recent Verify Packages runs:" >&2
            gh run list -R "$REPO" --workflow verify-packages.yml --limit 10 \
              --json databaseId,conclusion,createdAt,displayTitle \
              --template '{{range .}}  {{.databaseId}}  {{.conclusion}}  {{.createdAt}}  {{.displayTitle}}{{"\n"}}{{end}}' >&2 || true
            echo "" >&2
            echo "Verify this build with:" >&2
            echo "  gh workflow run verify-packages.yml -R $REPO -f run_id=$RUN_ID" >&2
            exit 1
          fi

          echo "==> Verified by Verify Packages run $VERIFY_RUN"
          echo "    $GITHUB_SERVER_URL/$REPO/actions/runs/$VERIFY_RUN"
          echo "verify_run_id=$VERIFY_RUN" >> "$GITHUB_OUTPUT"

      # ====================================================================
      # 3. CHECK OUT THE SOURCE THAT PRODUCED THOSE PACKAGES
      # ====================================================================
      - name: Checkout Build Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.sha }}

      # ====================================================================
      # 4. COLLECT THE PACKAGES
      # ====================================================================
      # Cross-run download, so run-id + github-token are required. See the note
      # in verify-packages.yml: `archive: false` uploads cannot be downloaded by
      # anything, so the build must keep producing archived artifacts.
      - name: Download Packages From Build Run
        uses: actions/download-artifact@v7
        with:
          path: _artifacts
          merge-multiple: true
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: List Downloaded Packages
        run: |
          set -euo pipefail
          echo "==> Downloaded artifact tree:"
          find _artifacts -type f | sort

      # ====================================================================
      # 4b. RESOLVE SANDBOX SERVER RUNS TO PUBLISH ALONGSIDE THE SHELL
      #
      # Each of the (optional) server_*_tag inputs names a MariaDB
      # branch/tag, not a run id -- the same string you'd pass as
      # sandbox-server.yml's own mariadb_version input. That workflow's
      # run-name embeds that exact string (see its run-name:), which is the
      # only way to find the right run: the Actions API does not expose a
      # workflow_dispatch run's inputs directly. The latest successful run
      # whose display title matches is used; a tag with no matching run, or
      # left blank, simply drops that line from this release rather than
      # failing the whole publish (unlike the shell build above, a missing
      # server line is expected and fine -- not every release ships all
      # three).
      # ====================================================================
      - name: Resolve Sandbox Server Runs
        id: server_runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_11: ${{ inputs.server_11_tag }}
          TAG_12: ${{ inputs.server_12_tag }}
          TAG_13: ${{ inputs.server_13_tag }}
        run: |
          set -euo pipefail

          resolve() {
            local label="$1" tag="$2"
            if [ -z "$tag" ]; then
              echo "==> [$label] no tag given; skipping this server line."
              return
            fi

            echo "==> [$label] looking for the latest successful Sandbox Server run for '$tag'"
            local match
            match=$(gh run list -R "$REPO" --workflow sandbox-server.yml \
              --status success --limit 50 \
              --json databaseId,displayTitle,headSha \
              --jq "[.[] | select(.displayTitle == \"Sandbox Server $tag\")][0] // empty")

            if [ -z "$match" ]; then
              echo "::warning::No successful Sandbox Server run found with tag '$tag' (run-name 'Sandbox Server $tag'); the $label.x line will be omitted."
              return
            fi

            local run_id sha
            run_id=$(jq -r .databaseId <<<"$match")
            sha=$(jq -r .headSha <<<"$match")
            echo "==> [$label] using run $run_id (commit $sha)"
            echo "run_id_$label=$run_id" >> "$GITHUB_OUTPUT"
            echo "sha_$label=$sha"       >> "$GITHUB_OUTPUT"
            echo "tag_$label=$tag"       >> "$GITHUB_OUTPUT"
          }

          resolve 11 "$TAG_11"
          resolve 12 "$TAG_12"
          resolve 13 "$TAG_13"

      # Three fixed, explicit steps rather than a loop: each line's presence
      # is independently conditional on the resolve step above having found a
      # matching run, and download-artifact needs its own step per run-id.
      - name: Download 11.x Server Packages
        if: steps.server_runs.outputs.run_id_11 != ''
        uses: actions/download-artifact@v7
        with:
          path: _server_artifacts/11
          merge-multiple: true
          run-id: ${{ steps.server_runs.outputs.run_id_11 }}
          github-token: ${{ github.token }}

      - name: Download 12.x Server Packages
        if: steps.server_runs.outputs.run_id_12 != ''
        uses: actions/download-artifact@v7
        with:
          path: _server_artifacts/12
          merge-multiple: true
          run-id: ${{ steps.server_runs.outputs.run_id_12 }}
          github-token: ${{ github.token }}

      - name: Download 13.x Server Packages
        if: steps.server_runs.outputs.run_id_13 != ''
        uses: actions/download-artifact@v7
        with:
          path: _server_artifacts/13
          merge-multiple: true
          run-id: ${{ steps.server_runs.outputs.run_id_13 }}
          github-token: ${{ github.token }}

      # ====================================================================
      # 5. ASSEMBLE RELEASE ASSETS
      # ====================================================================
      - name: Assemble Release Assets
        id: assets
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # Version from the same file cmake reads, at the build's commit, so the
          # tag cannot disagree with the version baked into the package names.
          eval "$(grep -E '^MYSQL_VERSION_(MAJOR|MINOR|PATCH|EXTRA)=' MYSQL_VERSION)"
          VERSION="${MYSQL_VERSION_MAJOR}.${MYSQL_VERSION_MINOR}.${MYSQL_VERSION_PATCH}${MYSQL_VERSION_EXTRA}"
          TAG="${TAG_INPUT:-v${VERSION}}"

          # gh run download nests one directory per artifact; flatten them into a
          # single asset directory.
          mkdir -p dist
          find _artifacts -type f -name '*.tar.gz' -exec mv -t dist/ {} +

          cd dist
          shopt -s nullglob
          pkgs=(*.tar.gz)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "Run ${{ steps.run.outputs.run_id }} produced no .tar.gz packages." >&2
            exit 1
          fi

          echo "==> Packages to publish (${#pkgs[@]}):"
          printf '    %s\n' "${pkgs[@]}"

          # Refuse a half set. Verification proves each package passed on a
          # pristine machine; it says nothing about a package that is no longer
          # here, and artifact retention differs per build leg (the Rocky legs
          # keep 7 days), so an older run can hand back a subset. The globs are
          # the ones verify-packages.yml verifies, so "verified" and "published"
          # cover the same platforms -- rather than a user's install.sh being the
          # thing that discovers the gap.
          missing=()
          for want in \
              "*-linux-glibc*-x86-64bit.tar.gz" \
              "*-linux-glibc*-arm-64bit.tar.gz" \
              "*-macos*-x86-64bit.tar.gz" \
              "*-macos*-arm-64bit.tar.gz" \
              "*-windows-x86-64bit.tar.gz" \
              "*-windows-arm-64bit.tar.gz"; do
            found=($want)
            if [ ${#found[@]} -ne 1 ]; then
              missing+=("$want (${#found[@]} matches)")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Run ${{ steps.run.outputs.run_id }} does not offer exactly one package per platform:" >&2
            printf '    %s\n' "${missing[@]}" >&2
            echo "Artifacts may have expired; rebuild and re-verify rather than publishing a partial release." >&2
            exit 1
          fi

          # SHA256SUMS is both the integrity check and the installer's manifest:
          # install.sh reads the available platforms straight out of it, so there
          # is no second index that can fall out of sync with the real assets.
          sha256sum "${pkgs[@]}" > SHA256SUMS
          echo "==> SHA256SUMS:"
          cat SHA256SUMS

          # Users install from the copies on the default branch, not from these.
          # They ship anyway so each release carries the installers it was tested
          # with -- an archival record, not something anyone fetches.
          cp ../install.sh install.sh
          cp ../install.ps1 install.ps1
          chmod +x install.sh

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      # ====================================================================
      # 5b. ASSEMBLE SERVER PACKAGES
      #
      # Kept separate from the shell assembly above so the sandbox packages
      # (named "...-sandbox.tar.gz", never matching the shell's per-platform
      # globs) can't affect that step's "exactly one package per platform"
      # count. Runs unconditionally; it's a no-op writing empty manifests
      # when no server_*_tag input resolved to a run.
      # ====================================================================
      - name: Assemble Server Packages
        id: server_assets
        run: |
          set -euo pipefail

          : > dist/SERVER_MANIFEST.tsv
          rm -f dist/SERVER_SHA256SUMS

          assemble() {
            local label="$1" run_id_var="run_id_$1" tag_var="tag_$1" sha_var="sha_$1"
            local run_id="${!run_id_var:-}"
            [ -z "$run_id" ] && return

            local tag="${!tag_var}" sha="${!sha_var}"
            local dir="_server_artifacts/$label"
            shopt -s nullglob
            local pkgs=("$dir"/*.tar.gz)
            if [ ${#pkgs[@]} -eq 0 ]; then
              echo "::warning::Sandbox Server run $run_id ($label.x, tag '$tag') produced no .tar.gz packages; omitting this line."
              return
            fi

            echo "==> [$label] publishing ${#pkgs[@]} package(s) from run $run_id (tag '$tag', commit $sha)"
            mv -t dist/ "${pkgs[@]}"
            for pkg in "${pkgs[@]}"; do
              printf '%s\t%s\t%s\t%s\n' "$label" "$tag" "$sha" "$(basename "$pkg")" >> dist/SERVER_MANIFEST.tsv
            done
          }

          run_id_11="${{ steps.server_runs.outputs.run_id_11 }}"
          tag_11="${{ steps.server_runs.outputs.tag_11 }}"
          sha_11="${{ steps.server_runs.outputs.sha_11 }}"
          run_id_12="${{ steps.server_runs.outputs.run_id_12 }}"
          tag_12="${{ steps.server_runs.outputs.tag_12 }}"
          sha_12="${{ steps.server_runs.outputs.sha_12 }}"
          run_id_13="${{ steps.server_runs.outputs.run_id_13 }}"
          tag_13="${{ steps.server_runs.outputs.tag_13 }}"
          sha_13="${{ steps.server_runs.outputs.sha_13 }}"

          assemble 11
          assemble 12
          assemble 13

          if [ -s dist/SERVER_MANIFEST.tsv ]; then
            cd dist
            cut -f4 SERVER_MANIFEST.tsv | xargs sha256sum > SERVER_SHA256SUMS
            echo "==> SERVER_SHA256SUMS:"
            cat SERVER_SHA256SUMS
          else
            echo "==> No server packages resolved; skipping SERVER_SHA256SUMS."
          fi

      # ====================================================================
      # 6. PUBLISH
      #
      # The notes are built before the dry-run branch on purpose: rendering them
      # is part of what a dry run is asked to prove. The branch sits immediately
      # before the first mutating command, so a dry run and a real publish differ
      # in exactly one thing.
      # ====================================================================
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.assets.outputs.tag }}
          VERSION: ${{ steps.assets.outputs.version }}
          SHA: ${{ steps.run.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          VERIFY_RUN_ID: ${{ steps.verified.outputs.verify_run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          INSTALLER_REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          # The install command is derived from the repo's own visibility rather
          # than hardcoded, so the notes can never advertise a command the reader
          # cannot run: while the repo is private, nothing can be fetched from it
          # anonymously, and the command has to carry credentials. The day the
          # repo goes public this flips to the plain one on its own.
          PRIVATE=$(gh api "repos/$REPO" --jq .private)

          # /releases/latest/ skips prereleases, so a prerelease has to be
          # installed by an explicitly pinned tag. A stable release needs no pin,
          # and gets a command with no version in it at all -- one that keeps
          # working for every later release without the notes being edited.
          # The same pin, said twice: the shell takes it as a one-shot variable
          # assignment, PowerShell needs it set as its own statement first.
          if [ "$PRERELEASE" = "true" ]; then
            RUN_INSTALLER="MARIADB_SHELL_TAG=$TAG bash"
            PS_PIN="\$env:MARIADB_SHELL_TAG = '$TAG'"
          else
            RUN_INSTALLER="bash"
            PS_PIN=""
          fi

          if [ "$PRIVATE" = "false" ]; then
            SH_CMD="curl -fsSL https://github.com/$REPO/raw/$INSTALLER_REF/install.sh | $RUN_INSTALLER"
            PS_CMD="irm https://github.com/$REPO/raw/$INSTALLER_REF/install.ps1 | iex"
            PRIVATE_NOTE=""
          else
            # Two credentialed hops, and only the first needs saying: the script
            # has to be fetched by hand, from raw.githubusercontent.com because
            # github.com/<owner>/<repo>/raw/ answers 404 to a bearer token. The
            # packages need no flag -- the installer finds gh's login by itself.
            SH_CMD="curl -fsSL -H \"Authorization: Bearer \$(gh auth token)\" \\
               https://raw.githubusercontent.com/$REPO/$INSTALLER_REF/install.sh \\
            | $RUN_INSTALLER"
            PS_CMD="\$h = @{ Authorization = \"Bearer \$(gh auth token)\" }
          irm https://raw.githubusercontent.com/$REPO/$INSTALLER_REF/install.ps1 -Headers \$h | iex"
            PRIVATE_NOTE="This repository is private, so the installer itself has
          to be fetched with credentials -- the commands below assume the GitHub
          CLI is logged in (\`gh auth login\`). They name raw.githubusercontent.com
          rather than github.com because only that host honours a token. The
          packages need no extra flag: the installer picks up the same login on
          its own. Without gh, set \`MARIADB_SHELL_TOKEN\` to a token with read
          access and send that same token in the header.

          "
          fi

          # PowerShell needs the tag pinned on its own line, so the block is
          # assembled rather than interpolated -- an always-present pin would
          # leave a blank first line in every stable release's snippet.
          if [ -n "$PS_PIN" ]; then
            PS_BLOCK="$PS_PIN
          $PS_CMD"
          else
            PS_BLOCK="$PS_CMD"
          fi

          NOTES="MariaDB Shell $VERSION, built from \`$SHA\` (build run $RUN_ID,
          verified by run $VERIFY_RUN_ID).

          ## Install

          ${PRIVATE_NOTE}### Linux and macOS

          \`\`\`sh
          $SH_CMD
          \`\`\`

          Installs into \`~/.local/share/mariadb-shell/<version>\` and links both
          \`mariadb-shell\` and its short alias \`msh\` into \`~/.local/bin\`.

          ### Windows (PowerShell)

          \`\`\`powershell
          $PS_BLOCK
          \`\`\`

          Installs into \`%LOCALAPPDATA%\\Programs\\mariadb-shell\\<version>\` and
          writes \`mariadb-shell.cmd\` and \`msh.cmd\` into its \`bin\` folder.
          That folder is not added to PATH unless you re-run with \`-AddToPath\`.

          Both installers detect your CPU (and on Linux your glibc version), pick
          the matching package and verify its checksum before unpacking. Only the
          two newest versions are kept -- installing a new one removes anything
          older than the pair.

          ## Manual download

          Pick the tarball for your platform below, download SHA256SUMS beside
          it, then check one against the other.

          Linux:

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          macOS, which ships \`shasum\` rather than \`sha256sum\`:

          \`\`\`sh
          shasum -a 256 -c SHA256SUMS --ignore-missing
          \`\`\`

          Windows, where neither exists -- PowerShell compares the hash itself:

          \`\`\`powershell
          \$file = 'mariadb-shell-$VERSION-windows-x86-64bit.tar.gz'
          \$want = (Select-String -Path SHA256SUMS -Pattern ([regex]::Escape(\$file))).Line.Split(' ')[0]
          if ((Get-FileHash \$file -Algorithm SHA256).Hash -eq \$want) { 'OK' } else { 'MISMATCH' }
          \`\`\`

          \`--ignore-missing\` is what lets the check pass with only the one
          tarball you downloaded present, rather than all of them."

          # Second table, appended only when at least one server_*_tag input
          # resolved to a run (5b writes one manifest row per package it
          # moved into dist/). The manifest itself is bookkeeping for this
          # step, not a release asset -- its content ends up in the notes
          # text and in SERVER_SHA256SUMS, so it's removed before dist/* gets
          # uploaded below.
          if [ -s dist/SERVER_MANIFEST.tsv ]; then
            ROWS=""
            while IFS=$'\t' read -r label tag sha pkg; do
              ROWS="${ROWS}| ${label}.x | \`${tag}\` | \`${sha:0:7}\` | \`${pkg}\` |
          "
            done < dist/SERVER_MANIFEST.tsv

            NOTES="$NOTES

          ## Sandbox server packages

          Built by [MariaDB-Sandbox-Server](../../actions/workflows/sandbox-server.yml)
          runs matching each tag below. Checksums are in \`SERVER_SHA256SUMS\`.

          | Line | Tag | Commit | Package |
          |---|---|---|---|
          $ROWS"
          fi
          rm -f dist/SERVER_MANIFEST.tsv

          # gh release view is read-only, so a dry run can still report which of
          # the two paths a real run would take -- create, or clobber an existing
          # release's assets.
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            EXISTS=yes
          else
            EXISTS=no
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "==> DRY RUN: no release will be created, updated or tagged."
            if [ "$EXISTS" = yes ]; then
              echo "    Would UPDATE existing release $TAG (assets clobbered)"
            else
              echo "    Would CREATE release $TAG on $SHA"
            fi
            echo "    prerelease=$PRERELEASE"
            echo "    Assets:"
            ls -1 dist | sed 's/^/      /'
            echo "    Notes:"
            printf '%s\n' "$NOTES" | sed 's/^/      /'
            exit 0
          fi

          if [ "$EXISTS" = yes ]; then
            echo "==> Updating existing release $TAG"
            gh release upload "$TAG" dist/* -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" --notes "$NOTES" \
              --prerelease="$PRERELEASE"
          else
            echo "==> Creating release $TAG"
            gh release create "$TAG" dist/* -R "$REPO" \
              --target "$SHA" \
              --title "MariaDB Shell $VERSION" \
              --notes "$NOTES" \
              --prerelease="$PRERELEASE"
          fi

          echo "==> Published: https://github.com/$REPO/releases/tag/$TAG"

      # The assets a dry run assembled but did not upload anywhere -- SHA256SUMS
      # and both installers included, so the manifest they read can be checked
      # before a release ever exists. Excludes the tarballs: they are already in
      # the build run, and re-uploading ~6 of them per dry run is pointless.
      - name: Upload Assembled Assets (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-assets-${{ steps.run.outputs.run_id }}
          path: |
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
            dist/SERVER_SHA256SUMS
          retention-days: 7
          if-no-files-found: error
