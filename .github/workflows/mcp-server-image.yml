name: MCP Server Image

# Builds the MariaDB Shell MCP Server image (docker/linux-debian13-mcp-server.Dockerfile)
# from a published release, smoke-tests it on both platforms and pushes it to
# Docker Hub as one multi-arch image.
#
# publish-release.yml calls it after a real publish. A release created with
# GITHUB_TOKEN starts no `on: release` workflow, hence workflow_call rather
# than a release trigger. Run it by hand to rebuild the image of any release,
# for example after a change to the Dockerfile or the entrypoint.
#
# Tags: X.Y.Z always; X.Y when no newer release of X.Y is published, and
# latest when no newer release is published at all, so rebuilding an older
# release moves neither. Prereleases count, as they do for the installers.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Shell version, e.g. 26.10.3 (blank = newest published release)"
        type: string
        required: false
      release_tag:
        description: "Release tag (blank = v<version>)"
        type: string
        required: false
      dry_run:
        description: "Build and smoke-test, but push nothing"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release_tag:
        type: string
        required: false
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: true

run-name: >-
  ${{ inputs.dry_run && 'Dry run' || 'Image' }}
  ${{ inputs.version || '(newest release)' }}

# Two runs pushing the same moving tags must not interleave.
concurrency:
  group: mcp-server-image
  cancel-in-progress: false

env:
  IMAGE: docker.io/mariadb/mariadb-shell-mcp-server
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read   # checkout, and read the releases

    steps:
      - uses: actions/checkout@v4

      # ====================================================================
      # 1. RESOLVE THE RELEASE AND THE TAGS
      # ====================================================================
      - name: Resolve Release and Tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          # Published releases only: drafts are skipped, prereleases count.
          versions=$(gh release list -R "$REPO" --exclude-drafts --limit 200 \
                       --json tagName --jq '.[].tagName' \
                     | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p')

          if [ -z "$VERSION" ]; then
            VERSION=$(sort -V <<< "$versions" | tail -n 1)
            [ -n "$VERSION" ] || { echo "::error::no published v<X.Y.Z> release found"; exit 1; }
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not X.Y.Z"
            exit 1
          fi
          TAG=${RELEASE_TAG:-v$VERSION}

          # The Dockerfile downloads the tarballs from this release, so it has
          # to be published, not a draft.
          draft=$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft) \
            || { echo "::error::no release $TAG"; exit 1; }
          if [ "$draft" = true ]; then
            echo "::error::release $TAG is a draft"
            exit 1
          fi

          # A release under another tag is not in the list above; add it.
          versions=$(printf '%s\n%s\n' "$versions" "$VERSION" | sed '/^$/d' | sort -uV)
          minor=${VERSION%.*}
          newest=$(tail -n 1 <<< "$versions")
          newest_minor=$(awk -F. -v m="$minor" '$1 "." $2 == m' <<< "$versions" | tail -n 1)

          tags="$IMAGE:$VERSION"
          [ "$newest_minor" = "$VERSION" ] && tags="$tags $IMAGE:$minor"
          [ "$newest" = "$VERSION" ] && tags="$tags $IMAGE:latest"

          echo "==> Release $TAG, version $VERSION"
          echo "==> Tags: $tags"
          {
            echo "version=$VERSION"
            echo "release_tag=$TAG"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      # ====================================================================
      # 2. BUILD AND SMOKE-TEST EACH PLATFORM
      #
      # The build only runs curl and tar, so the foreign platform builds
      # quickly under QEMU; its smoke test takes about a minute there. The
      # push below rebuilds from the builder's cache, so it pushes what was
      # tested here.
      # ====================================================================
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and Smoke-Test
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        run: |
          set -euo pipefail
          for platform in ${PLATFORMS//,/ }; do
            local_tag="mcp-server-smoke:${platform#linux/}"
            echo "::group::Build $platform"
            docker buildx build --platform "$platform" --load \
              --build-arg VERSION="$VERSION" --build-arg RELEASE_TAG="$RELEASE_TAG" \
              -t "$local_tag" -f docker/linux-debian13-mcp-server.Dockerfile docker
            echo "::endgroup::"
            docker/smoke-test-mcp-server.sh "$local_tag" "$platform"
          done

      # ====================================================================
      # 3. PUSH
      # ====================================================================
      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          # An organization access token logs in as the organization. Its
          # name is plain text, not the DOCKERHUB_USERNAME secret: GitHub
          # masks every secret a workflow references in its whole log, and
          # "mariadb" is in every image tag and version line.
          username: mariadb
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          for t in $TAGS; do tag_args+=(-t "$t"); done
          docker buildx build --platform "$PLATFORMS" --push \
            --build-arg VERSION="$VERSION" --build-arg RELEASE_TAG="$RELEASE_TAG" \
            "${tag_args[@]}" -f docker/linux-debian13-mcp-server.Dockerfile docker

      - name: Check the Pushed Image
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.tags.outputs.version }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
                      | jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' \
                      | sort | paste -sd, -)
          echo "==> $IMAGE:$VERSION: $platforms"
          if [ "$platforms" != "$PLATFORMS" ]; then
            echo "::error::expected $PLATFORMS, got $platforms"
            exit 1
          fi
          {
            echo "### MCP Server Image $VERSION"
            echo
            for t in $TAGS; do echo "- \`$t\`"; done
            echo
            echo "Platforms: $platforms"
          } >> "$GITHUB_STEP_SUMMARY"
